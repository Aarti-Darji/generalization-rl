[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genrl"
version = "0.1.0"
description = "Selection bias and variance sources in RL post-training of small reasoning models"
authors = [{ name = "Aarti Darji" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
train = [
    "torch>=2.3",
    "transformers>=5.0",
    "datasets>=3.0",
    "trl>=1.16,<2",
    "vllm>=0.22,<=0.31",
    "wandb>=0.18",
]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
