# Evaluation pool: GSM8K test + MATH-500 (~1,800 problems).
datasets: [gsm8k_test, math500]
temperature: 0.7
top_p: 1.0
max_tokens: 768
samples_per_problem: 4          # replicates for every checkpoint (Part B needs R >= 2)
samples_per_problem_final: 64   # base, SFT and final RL models (pass@k)
seed: 1234
output: results/logs/samples.parquet
save_raw_text: true             # needed to debug the answer extractor
